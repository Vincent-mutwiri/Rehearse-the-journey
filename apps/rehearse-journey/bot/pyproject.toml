[project]
name = "rehearse-journey-bot"
version = "0.1.0"
description = "Receptionist Joy voice bot — Rehearse the Journey demo (Pipecat)"
requires-python = ">=3.11"
dependencies = [
    # Silero VAD uses the bundled ONNX model; Whisper requires speech boundaries.
    "pipecat-ai[openai,webrtc,runner,silero]==1.15.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
# Switch to this if using Gemini Live: uv sync --extra gemini
gemini = [
    "pipecat-ai[google,webrtc,runner,silero]==1.15.0",
]

[tool.uv]
# Extend timeout for large package downloads
# UV_HTTP_TIMEOUT=120 uv sync
